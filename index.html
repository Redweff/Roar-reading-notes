    // Estrogen (雌激素): Day 1-5 低, Day 12-13 排卵前高峰, Day 14 回落, Day 20-23 黄体期次高峰
    let estrogen = 15;
    if (d <= 5) estrogen = 15 + d * 2;
    else if (d <= 13) estrogen = 25 + Math.pow(d - 5, 1.85) * 2.1;
    else if (d <= 15) estrogen = 90 - (d - 13) * 30;
    else if (d <= 22) estrogen = 30 + (d - 15) * 7.5;

    if (d <= 14) progesterone = 5;

    else progesterone = Math.max(8, 95 - (d - 22) * 14.5);

    if (d === 12) lh = 48;
    if (d === 13) lh = 96;
    if (d === 14) lh = 55;

    // FSH (促卵泡激素)

    let trainingAdvice = '';
